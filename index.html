<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drone VIXX — Briefing de Gravação</title><style>body{font-family:Arial,sans-serif;background:#f5f6f8;color:#172a46;margin:0;padding:24px}.card{max-width:760px;margin:auto;background:#fff;border-radius:22px;padding:30px;box-shadow:0 15px 45px #0001}img{max-width:260px;max-height:90px}.bar{height:5px;background:#ddd;margin:20px 0}.fill{height:100%;background:#172a46;width:0}.step{display:none}.step.active{display:block}h1{font-size:28px}label{display:block;font-weight:bold;margin:18px 0 7px}input,textarea,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;font:inherit}.options{display:grid;gap:9px}.option{padding:13px;border:1px solid #ddd;border-radius:10px;cursor:pointer}.option.selected{background:#f7e9ee;border-color:#b96d88}.actions{display:flex;justify-content:space-between;margin-top:25px}button{padding:13px 20px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.next{background:#172a46;color:#fff}.back{background:#eee}.finish{text-align:center}.intro{margin-bottom:20px}.small{color:#687386;font-size:14px;line-height:1.5}.error{color:#b94c67;margin-top:8px;font-size:13px}</style></head><body><div class="card"><div id="brand"><h2 style="margin:0">DRONE VIXX</h2></div><div class="intro"><h1>Briefing de gravação</h1><p class="small">Vamos reunir as informações que ajudarão a Drone VIXX a preparar o roteiro da gravação. Leva aproximadamente 3 minutos.</p></div><div class="bar"><div id="fill" class="fill"></div></div><form id="f"></form><div class="actions"><button id="back" class="back" type="button">Voltar</button><button id="next" class="next" type="button">Próxima</button></div></div><script>const API='https://ep-falling-frost-ac6kshzo.apirest.sa-east-1.aws.neon.tech/corretores/rest/v1/briefings_corretor';const Q=[['Nome do corretor','text',1],['WhatsApp','text',1],['CRECI','text',0],['Tipo de imóvel','choice',1,['Apartamento','Casa','Cobertura','Terreno','Sítio / Chácara','Comercial','Outro']],['Endereço','text',1],['Bairro','text',1],['Cidade','text',1],['Área privativa (m²)','text',0],['Área total (m²)','text',0],['Quartos','number',0],['Suítes','number',0],['Banheiros','number',0],['Vagas','number',0],['Andar','text',0],['Ano de construção','number',0],['Valor de venda','number',1],['Condições de pagamento','multi',0,['À vista','Financiamento bancário','FGTS','Entrada + financiamento','Permuta','Outra condição']],['3 principais diferenciais','textarea',1],['Pitch de 30 segundos','textarea',1],['Possui vista relevante?','choice',1,['Sim','Não']],['Vista','textarea',0],['Vista permanente','choice',0,['Sim','Não','Não sei']],['Posição solar','choice',0,['Sol da manhã','Sol da tarde','Sol da manhã e da tarde','Não sei']],['Áreas do condomínio','multi',0,['Piscina','Academia','Salão de festas','Espaço gourmet','Playground','Churrasqueira','Sauna','Quadra','Outras']],['Objetivos do drone','multi',0,['Localização','Praia','Vista','Condomínio','Área externa','Bairro','Comércio próximo','Vias de acesso','Pontos de referência']],['Pontos de referência','textarea',0],['Ideia do corretor','textarea',0],['Cena ou ambiente indispensável','textarea',0],['Restrições de imagem','textarea',0],['Restrições de gravação','choice',1,['Não','Sim','Não sei']],['Detalhes das restrições','textarea',0],['Objetivo do vídeo','multi',1,['Apresentar o imóvel','Gerar leads','Vender rapidamente','Valorizar o imóvel','Anúncio patrocinado','Apresentação para cliente específico']],['Canais de publicação','multi',0,['Instagram Reels','Stories','YouTube','TikTok','WhatsApp','Site','Anúncio patrocinado']],['Público-alvo','multi',0,['Família','Casal','Solteiros','Investidores','Alto padrão','Outro']],['Principal mensagem','textarea',1]];let i=0,a={};const f=document.getElementById('f');Q.forEach((q,n)=>{const s=document.createElement('section');s.className='step';s.dataset.n=n;const h=document.createElement('h2');h.textContent=q[0];s.appendChild(h);if(q[1]=='choice'||q[1]=='multi'){const d=document.createElement('div');d.className='options';q[3].forEach(x=>{const o=document.createElement('div');o.className='option';o.textContent=x;o.onclick=()=>{if(q[1]=='multi')o.classList.toggle('selected');else{d.querySelectorAll('.option').forEach(z=>z.classList.remove('selected'));o.classList.add('selected')}};d.appendChild(o)});s.appendChild(d)}else{const e=q[1]=='textarea'?document.createElement('textarea'):document.createElement('input');if(q[1]=='number'){e.type='number';e.step='1';e.min='0';e.inputMode='numeric'}else e.type=q[1];e.name=q[0];e.required=!!q[2];s.appendChild(e)}f.appendChild(s)});function visible(){return[...f.children].filter(s=>{const n=+s.dataset.n,t=a['Tipo de imóvel'];if([7,8,9,10,11,12,13,14,23].includes(n)&&!['Apartamento','Cobertura'].includes(t))return false;if(n==20&&a['Possui vista relevante?']!=='Sim')return false;if(n==21&&a['Possui vista relevante?']!=='Sim')return false;if(n==24&&a['Áreas do condomínio']===undefined)return false;if(n==30&&a['Restrições de gravação']!=='Sim')return false;return true})}function get(s){const q=Q[+s.dataset.n],d=s.querySelector('.options');return d?[...d.querySelectorAll('.selected')].map(x=>x.textContent.trim()):(s.querySelector('input,textarea')?.value.trim()||'')}function valid(s){const q=Q[+s.dataset.n],v=get(s);return !q[2]||Array.isArray(v)?(Array.isArray(v)?v.length>0:!!v):true}function save(s){a[Q[+s.dataset.n][0]]=get(s)}function render(){const vs=visible();if(i>=vs.length)i=vs.length-1;[...f.children].forEach(s=>s.classList.remove('active'));vs[i].classList.add('active');document.getElementById('fill').style.width=(i/vs.length*100)+'%';document.getElementById('back').disabled=i===0;document.getElementById('next').textContent=i===vs.length-1?'Enviar briefing':'Próxima'}document.getElementById('next').onclick=async()=>{const vs=visible(),s=vs[i];if(!valid(s)){alert('Preencha este campo para continuar.');return}save(s);const nv=visible();if(i<nv.length-1){i++;render();return}const b=document.getElementById('next');b.disabled=true;b.textContent='Enviando…';const p={nome_corretor:a['Nome do corretor'],whatsapp:a['WhatsApp'],creci:a['CRECI']||null,tipo_imovel:a['Tipo de imóvel'],endereco:a['Endereço'],bairro:a['Bairro'],cidade:a['Cidade'],valor_venda:a['Valor de venda']?parseInt(a['Valor de venda'],10):null,respostas:a,user_agent:navigator.userAgent};try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(p)});if(!r.ok)throw Error();f.innerHTML='<div class="finish"><h1>Briefing enviado!</h1><p class="small">Obrigado. As informações foram recebidas pela Drone VIXX e serão utilizadas no planejamento da gravação.</p></div>';document.querySelector('.actions').style.display='none';document.getElementById('fill').style.width='100%'}catch(e){b.disabled=false;b.textContent='Tentar novamente';alert('Não foi possível enviar o briefing. Tente novamente.')}};document.getElementById('back').onclick=()=>{const vs=visible();if(i>0){save(vs[i]);i--;render()}};render();</script></body></html>

<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drone VIXX — Briefing de Gravação</title><style>body{font-family:Arial,sans-serif;background:#f5f6f8;color:#172a46;margin:0}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border-radius:24px;padding:30px;box-shadow:0 15px 45px #0001}.logo{max-width:240px;max-height:90px;display:block;margin-bottom:18px}h1{font-size:28px}.muted{color:#687386;line-height:1.5}.progress{height:5px;background:#eee;margin:20px 0}.bar{height:100%;width:0;background:#d88aa3;transition:.3s}.step{display:none}.step.active{display:block}.option{padding:14px;border:1px solid #dfe3e8;border-radius:12px;margin:9px 0;cursor:pointer}.option.selected{border-color:#d88aa3;background:#fff7f9}.options{margin-bottom:20px}input,textarea,select{width:100%;box-sizing:border-box;padding:14px;border:1px solid #dfe3e8;border-radius:12px;font:inherit;margin:6px 0 16px}textarea{min-height:110px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{padding:13px 18px;border:0;border-radius:12px;font-weight:bold;cursor:pointer}.next{background:#172a46;color:#fff}.back{background:#eef1f4;color:#172a46}.actions{display:flex;justify-content:space-between;margin-top:20px}.summary{background:#f7f8fa;padding:16px;border-radius:12px;max-height:330px;overflow:auto}.success{text-align:center}.error{color:#b94c67}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.card{padding:22px}}</style></head><body><div class="wrap"><div class="card"><img id="logo" class="logo" alt="Drone VIXX"><h1>Briefing de gravação</h1><p class="muted">Vamos reunir as informações que ajudarão a Drone VIXX a preparar o roteiro da gravação.</p><div class="progress"><div class="bar" id="bar"></div></div><div id="steps"></div><div class="actions"><button class="back" id="back" disabled>Voltar</button><button class="next" id="next">Próxima</button></div></div></div><script>
const API='https://ep-falling-frost-ac6kshzo.apirest.sa-east-1.aws.neon.tech/corretores/rest/v1/briefings_corretor';
const questions=[
['Nome do corretor','text',1],['WhatsApp','text',1],['CRECI','text',0],['Tipo de imóvel','choice',1,['Apartamento','Casa','Cobertura','Terreno','Sítio / Chácara','Comercial','Outro']],['Endereço','text',1],['Bairro','text',1],['Cidade','text',1],['Área privativa (m²)','text',0],['Área total (m²)','text',0],['Quartos','number',0],['Suítes','number',0],['Banheiros','number',0],['Vagas','number',0],['Andar','text',0],['Ano de construção','number',0],['Valor de venda','number',1],['Condições de pagamento','multi',0,['À vista','Financiamento bancário','FGTS','Entrada + financiamento','Permuta','Outra condição']],['3 principais diferenciais','textarea',1],['Pitch de 30 segundos','textarea',1],['Possui vista relevante?','choice',1,['Sim','Não']],['Vista','textarea',0],['Vista permanente','choice',0,['Sim','Não','Não sei']],['Posição solar','choice',0,['Sol da manhã','Sol da tarde','Sol da manhã e da tarde','Não sei']],['Áreas do condomínio','multi',0,['Piscina','Academia','Salão de festas','Espaço gourmet','Playground','Churrasqueira','Sauna','Quadra','Outras']],['Objetivos do drone','multi',0,['Localização','Praia','Vista','Condomínio','Área externa','Bairro','Comércio próximo','Vias de acesso','Pontos de referência']],['Pontos de referência','textarea',0],['Ideia do corretor','textarea',0],['Cena ou ambiente indispensável','textarea',0],['Restrições de imagem','textarea',0],['Restrições de gravação','choice',1,['Não','Sim','Não sei']],['Detalhes das restrições','textarea',0],['Objetivo do vídeo','multi',1,['Apresentar o imóvel','Gerar leads','Vender rapidamente','Valorizar o imóvel','Anúncio patrocinado','Apresentação para cliente específico']],['Canais de publicação','multi',0,['Instagram Reels','Stories','YouTube','TikTok','WhatsApp','Site','Anúncio patrocinado']],['Público-alvo','multi',0,['Família','Casal','Solteiros','Investidores','Alto padrão','Outro']],['Principal mensagem','textarea',1]
];
let answers={},i=0;const root=document.getElementById('steps');
questions.forEach((q,n)=>{let s=document.createElement('section');s.className='step';s.dataset.n=n;let h=document.createElement('h2');h.textContent=q[0];s.appendChild(h);if(q[1]=='choice'||q[1]=='multi'){let box=document.createElement('div');box.className='options';box.dataset.key=q[0];q[3].forEach(v=>{let o=document.createElement('div');o.className='option';o.textContent=v;o.onclick=()=>{if(q[1]=='multi')o.classList.toggle('selected');else{box.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));o.classList.add('selected')}};box.appendChild(o)});s.appendChild(box)}else{let el=q[1]=='textarea'?document.createElement('textarea'):document.createElement('input');el.type=q[1]=='number'?'number':q[1];el.name=q[0];el.required=!!q[2];if(q[0]=='Valor de venda')el.step='1';s.appendChild(el)}root.appendChild(s)});
function visible(){return [...root.children].filter(s=>{let n=+s.dataset.n;if([7,8,9,10,11,12,13,14].includes(n)&&!['Apartamento','Cobertura'].includes(answers['Tipo de imóvel']))return false;if(n==20&&!answers['Possui vista relevante?'])return false;if([21].includes(n)&&answers['Possui vista relevante?']!=='Sim')return false;if(n==23&&!['Apartamento','Cobertura'].includes(answers['Tipo de imóvel']))return false;if(n==24&&!answers['Áreas do condomínio'])return false;if(n==29&&answers['Restrições de gravação']!=='Sim')return false;return true})}
function save(s){let q=questions[+s.dataset.n],box=s.querySelector('.options');if(box)answers[q[0]]=[...box.querySelectorAll('.selected')].map(x=>x.textContent.trim());else{let el=s.querySelector('input,textarea');if(el.value.trim())answers[q[0]]=el.value.trim()}}
function val(s){let q=questions[+s.dataset.n],box=s.querySelector('.options');if(q[2]&&box&&!box.querySelector('.selected'))return false;let el=s.querySelector('input,textarea');return !q[2]||!el||el.value.trim()}
function render(){let vs=visible();if(i>=vs.length)i=vs.length-1;[...root.children].forEach(s=>s.classList.remove('active'));vs[i].classList.add('active');document.getElementById('bar').style.width=(i/vs.length*100)+'%';document.getElementById('back').disabled=i===0;document.getElementById('next').textContent=i===vs.length-1?'Enviar briefing':'Próxima'}
document.getElementById('next').onclick=async()=>{let vs=visible(),s=vs[i];if(!val(s)){alert('Preencha este campo para continuar.');return}save(s);vs=visible();if(i<vs.length-1){i++;render();return}let b=document.getElementById('next');b.disabled=true;b.textContent='Enviando…';let p={nome_corretor:answers['Nome do corretor'],whatsapp:answers['WhatsApp'],creci:answers['CRECI']||null,tipo_imovel:answers['Tipo de imóvel'],endereco:answers['Endereço'],bairro:answers['Bairro'],cidade:answers['Cidade'],valor_venda:answers['Valor de venda']?parseInt(answers['Valor de venda'],10):null,respostas:answers,user_agent:navigator.userAgent};try{let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(p)});if(!r.ok)throw Error();root.innerHTML='<div class="success"><h2>Briefing enviado!</h2><p class="muted">Obrigado. As informações foram recebidas pela Drone VIXX e serão utilizadas no planejamento da gravação.</p></div>';document.querySelector('.actions').style.display='none';document.getElementById('bar').style.width='100%'}catch(e){b.disabled=false;b.textContent='Tentar novamente';alert('Não foi possível enviar. Tente novamente.')}};
document.getElementById('back').onclick=()=>{let vs=visible();if(i>0){save(vs[i]);i--;render()}};render();
// Logo is embedded from the supplied Drone VIXX artwork.
</script></body></html>

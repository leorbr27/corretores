<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Briefing • Drone VIXX</title>
<style>
:root{--pink:#d98aa4;--blue:#132b55;--bg:#f5f6f8;--text:#172033;--muted:#687386;--line:#e2e6ec}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.wrap{min-height:100vh;display:flex;justify-content:center;padding:18px 14px}.card{width:100%;max-width:620px;background:#fff;border-radius:24px;box-shadow:0 8px 30px #17203314;overflow:hidden;min-height:calc(100vh - 36px);display:flex;flex-direction:column}
.brand{padding:18px 22px 10px;text-align:center}.brand img{max-width:210px;max-height:62px;object-fit:contain}.brandFallback{font-weight:800;letter-spacing:.08em;color:var(--blue);font-size:22px}.progress{height:4px;background:#edf0f4}.bar{height:100%;width:0;background:var(--pink);transition:width .3s}
main{padding:28px 24px 12px;flex:1}.screen{display:none}.screen.active{display:block;animation:fade .22s ease}@keyframes fade{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}
h1{font-size:26px;line-height:1.16;margin:0 0 9px;color:var(--blue)}.help{font-size:14px;line-height:1.5;color:var(--muted);margin:0 0 22px}.field{margin-bottom:17px}.field label{display:block;font-size:14px;font-weight:650;margin-bottom:8px}.field small{display:block;color:var(--muted);margin-top:6px;font-size:12px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:13px;padding:14px;font:inherit;background:#fff;outline:none}textarea{min-height:110px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--pink);box-shadow:0 0 0 3px #d98aa420}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.checks{display:grid;gap:9px}.check{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px}.check input{width:auto;margin:0}.nav{display:flex;gap:10px;padding:16px 24px 24px;border-top:1px solid #f0f1f4}.btn{flex:1;border:0;border-radius:13px;padding:14px 16px;font-weight:750;font-size:15px;cursor:pointer}.back{background:#eef0f3;color:var(--text)}.next,.send{background:var(--blue);color:white}.error{color:#b42318;background:#fff0ef;border-radius:12px;padding:12px;font-size:14px;display:none;margin:0 24px 16px}.success{text-align:center;padding:35px 10px}.success h1{font-size:28px}.hidden{display:none!important}@media(max-width:480px){main{padding:24px 18px 8px}.nav{padding:14px 18px 20px}.grid{grid-template-columns:1fr}.brand{padding-top:14px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="brand"><img id="logo" src="logo.jpg" alt="Drone VIXX" onerror="this.style.display='none';document.getElementById('fallback').classList.remove('hidden')"><div id="fallback" class="brandFallback hidden">DRONE VIXX</div></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<main id="main"></main><div id="error" class="error">Não foi possível enviar o briefing. Tente novamente.</div>
<div class="nav"><button id="back" class="btn back">Voltar</button><button id="next" class="btn next">Continuar</button></div>
</div></div>
<script>
const API='https://ep-falling-frost-ac6kshzo.apirest.sa-east-1.aws.neon.tech/corretores/rest/v1/briefings_corretor';
const a={};let step=0;
const screens=[
 {title:'Vamos começar',help:'Essas informações identificam o corretor e serão usadas para preparar a gravação do imóvel.',fields:[['Nome do corretor','text',1],['Telefone / WhatsApp','tel',1]]},
 {title:'Tipo de imóvel',help:'Escolha o tipo de imóvel que será apresentado no vídeo.',fields:[['Tipo de imóvel','select',1,['Apartamento','Casa','Cobertura','Terreno','Sítio / Chácara','Comercial','Outro']]]},
 {title:'Onde fica o imóvel?',help:'Informe o endereço completo. O ponto de referência ajuda a planejar as imagens aéreas e a localização no vídeo.',fields:[['Endereço','text',1],['Bairro','text',1],['Cidade','text',1],['Ponto de referência','text',0]]},
 {title:'Valor e condições de pagamento',help:'Essas informações ajudam a apresentar o imóvel de forma objetiva e alinhada ao anúncio.',fields:[['Valor de venda','number',1],['Condições de pagamento','checks',1,['À vista','Financiamento bancário','FGTS','Carta de crédito (consórcio)','Permuta','Outra condição']]]},
 {title:'Características do imóvel',help:'Informe apenas o que souber. Esses dados ajudam a definir as cenas e o roteiro da gravação.',fields:[['Área privativa','text'],['Área total','text'],['Quartos','number'],['Suítes','number'],['Banheiros','number'],['Vagas','number'],['Andar','text'],['Ano de construção','number']] ,only:['Apartamento','Cobertura']},
 {title:'Principais diferenciais',help:'Liste os principais diferenciais que merecem destaque no vídeo, como vista, acabamento, localização, lazer ou ambientes especiais.',fields:[['Principais diferenciais','textarea',1]]},
 {title:'Como apresentar o imóvel?',help:'Explique, com suas palavras, qual é a ideia central que você gostaria que o vídeo transmitisse.',fields:[['Ideia para o vídeo','textarea',0],['Cena ou ambiente indispensável','textarea',0]]},
 {title:'Vista e posição solar',help:'Essas informações orientam as imagens externas e ajudam a mostrar a relação do imóvel com a luz e a paisagem.',fields:[['Possui vista relevante?','select',1,['Sim','Não']],['Vista','text',0,'conditionalVista'],['Vista permanente?','select',0,['Sim','Não','Não sei'],'conditionalVista'],['Posição solar','select',0,['Sol da manhã','Sol da tarde','Sol da manhã e da tarde','Não sei']]]},
 {title:'Áreas e lazer',help:'Selecione as áreas do condomínio que devem aparecer ou ser consideradas na gravação.',fields:[['Áreas do condomínio','checks',0,['Piscina','Academia','Salão de festas','Espaço gourmet','Playground','Churrasqueira','Sauna','Quadra','Outras']]],only:['Apartamento','Cobertura']},
 {title:'O que mostrar com o drone?',help:'Selecione os elementos externos que mais ajudam a contextualizar e valorizar o imóvel.',fields:[['Objetivos do drone','checks',0,['Localização','Praia','Vista','Condomínio','Área externa','Bairro','Comércio próximo','Vias de acesso','Pontos de referência']],['Pontos de referência importantes','text',0]]},
 {title:'Restrições de gravação',help:'Informe se existe alguma limitação de horário, área, condomínio, vizinhança, privacidade ou outro cuidado que devemos observar.',fields:[['Existem restrições de gravação?','select',1,['Não','Sim','Não sei']],['Detalhes das restrições','textarea',1,'conditionalRestricao']]},
 {title:'Objetivo do vídeo',help:'Escolha todos os objetivos que se aplicam. Isso ajuda a definir linguagem, enquadramentos e ritmo da edição.',fields:[['Objetivo do vídeo','checks',1,['Apresentar o imóvel','Gerar leads','Vender rapidamente','Valorizar o imóvel','Anúncio patrocinado','Apresentação para cliente específico']]]},
 {title:'Onde o vídeo será publicado?',help:'Selecione os canais previstos para publicação para que a gravação considere os formatos necessários.',fields:[['Canais de publicação','checks',0,['Instagram Reels','Stories','YouTube','TikTok','WhatsApp','Site','Anúncio patrocinado']]]},
 {title:'Para quem é este imóvel?',help:'Selecione os públicos que mais se aproximam do comprador que você pretende alcançar.',fields:[['Público-alvo','checks',0,['Família','Casal','Solteiros','Investidores','Alto padrão','Outro']]]},
 {title:'Mensagem principal',help:'Em uma frase, qual é a principal mensagem que o vídeo deve deixar para quem assistir?',fields:[['Principal mensagem','textarea',1]]}
];
function visible(s){if(s.only&&!s.only.includes(a['Tipo de imóvel']))return false;return true}
function makeField(f){let [label,type,req,opt,cond]=f;if(cond==='conditionalVista'&&a['Possui vista relevante?']!=='Sim')return '';if(cond==='conditionalRestricao'&&a['Existem restrições de gravação?']!=='Sim')return '';let key=label, val=a[key]??'';let reqtxt=req?' <span style="color:#b42318">*</span>':'';if(type==='checks'){let vals=Array.isArray(val)?val:[];return `<div class="field"><label>${label}${reqtxt}</label><div class="checks">${opt.map(x=>`<label class="check"><input type="checkbox" data-key="${key}" value="${x}" ${vals.includes(x)?'checked':''}>${x}</label>`).join('')}</div></div>`}if(type==='select'){return `<div class="field"><label>${label}${reqtxt}</label><select data-key="${key}"><option value="">Selecione</option>${opt.map(x=>`<option ${val===x?'selected':''}>${x}</option>`).join('')}</select></div>`}if(type==='textarea')return `<div class="field"><label>${label}${reqtxt}</label><textarea data-key="${key}" placeholder="Digite aqui...">${val}</textarea></div>`;return `<div class="field"><label>${label}${reqtxt}</label><input data-key="${key}" type="${type}" value="${val}" ${type==='number'?'step="1" min="0" inputmode="numeric"':''}></div>`}
function render(){while(step<screens.length&&!visible(screens[step]))step++;const s=screens[step];if(!s){finish();return}document.getElementById('main').innerHTML=`<section class="screen active"><h1>${s.title}</h1><p class="help">${s.help}</p>${s.fields.map(makeField).join('')}</section>`;document.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('input',save));document.querySelectorAll('select[data-key]').forEach(el=>el.addEventListener('change',save));document.querySelectorAll('input[type=checkbox]').forEach(el=>el.addEventListener('change',save));document.getElementById('back').style.visibility=step===0?'hidden':'visible';document.getElementById('next').textContent=step===screens.length-1?'Enviar briefing':'Continuar';document.getElementById('bar').style.width=((step+1)/screens.length*100)+'%'}
function save(e){let k=e.target.dataset.key;if(e.target.type==='checkbox'){a[k]=[...document.querySelectorAll(`input[data-key="${k}"]:checked`)].map(x=>x.value)}else a[k]=e.target.value;if(k==='Possui vista relevante?'||k==='Existem restrições de gravação?')render()}
function valid(){const s=screens[step];for(const f of s.fields){const [k,t,r,c,cond]=f;if(cond==='conditionalVista'&&a['Possui vista relevante?']!=='Sim')continue;if(cond==='conditionalRestricao'&&a['Existem restrições de gravação?']!=='Sim')continue;if(r&&((t==='checks'&&!Array.isArray(a[k]))|| (t==='checks'&&a[k].length===0)||(t!=='checks'&&!String(a[k]??'').trim())))return false}return true}
async function submit(){const payload={nome_corretor:a['Nome do corretor'],whatsapp:a['Telefone / WhatsApp'],creci:null,tipo_imovel:a['Tipo de imóvel'],endereco:a['Endereço'],bairro:a['Bairro'],cidade:a['Cidade'],valor_venda:a['Valor de venda']?parseInt(a['Valor de venda'],10):null,respostas:a,user_agent:navigator.userAgent};const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(payload)});if(!r.ok)throw new Error('send')}
async function finish(){try{await submit();document.getElementById('main').innerHTML='<section class="success"><h1>Briefing enviado!</h1><p class="help">Recebemos as informações do imóvel. A Drone VIXX usará esses dados para preparar a gravação.</p></section>';document.querySelector('.nav').style.display='none';document.getElementById('error').style.display='none'}catch(e){document.getElementById('error').style.display='block'}}
document.getElementById('back').onclick=()=>{if(step>0){step--;render()}};document.getElementById('next').onclick=()=>{document.getElementById('error').style.display='none';if(!valid()){alert('Preencha os campos obrigatórios antes de continuar.');return}step++;render()};render();
</script></body></html>
